<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      One build serves both domains, so this static head is Grounnel's — Grounnel is the umbrella
      and the public product. Social scrapers don't run JS, so the Biassemble domain previews with
      Grounnel's card; accepted (tasks.md, Phase 2b). The favicon deliberately stays Biassemble's.
    -->
    <title>Grounnel — Verify the claims in any text</title>
    <meta
      name="description"
      content="Grounnel pulls the factual claims out of a piece of writing and checks each one against the open web, marking them in place with the passage and source behind every verdict."
    />
    <link rel="canonical" href="https://grounnel.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grounnel" />
    <meta property="og:title" content="Grounnel — Verify the claims in any text" />
    <meta
      property="og:description"
      content="Paste an article and see which of its claims hold up. Every verdict comes with the passage and the source behind it."
    />
    <meta property="og:url" content="https://grounnel.vercel.app/" />
    <meta property="og:image" content="https://grounnel.vercel.app/og-grounnel.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grounnel — verify the claims in any text" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grounnel — Verify the claims in any text" />
    <meta
      name="twitter:description"
      content="Paste an article and see which of its claims hold up. Every verdict comes with the passage and the source behind it."
    />
    <meta name="twitter:image" content="https://grounnel.vercel.app/og-grounnel.png" />
    <!-- T046 — one WebApplication entity for the whole site; gen-seo-shells copies this template,
         so every shell carries it. `url` is the site root on purpose, not the per-page canonical. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Grounnel",
        "url": "https://grounnel.vercel.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Grounnel pulls the factual claims out of a piece of writing and checks each one against the open web, marking them in place with the passage and source behind every verdict.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <!--
      Crawlers and previews get a real heading, a sentence of copy and working links here; React's
      createRoot() replaces these children on mount, so nothing needs to match what it renders.
      gen-seo-shells rewrites this block per page from the same pageMeta() the head uses.
    -->
    <div id="root">
      <div data-seo-shell>
        <h1>Grounnel — Verify the claims in any text</h1>
        <p>
          Grounnel pulls the factual claims out of a piece of writing and checks each one against
          the open web, marking them in place with the passage and source behind every verdict.
        </p>
        <nav>
          <a href="/">Check a text</a> <a href="/about">How it works</a>
          <a href="/stats">What we have measured</a>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
